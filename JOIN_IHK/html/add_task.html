<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Add Task</title>
    <link rel="shortcut icon" href="../assets/icons/Join_dark.png" type="image/x-icon">

    <link rel="stylesheet" href="../styles/standards.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/add_task.css">
    <link rel="stylesheet" href="../styles/board.css">
    <link rel="stylesheet" href="../styles/media_queries.css">

    <script src="../scripts/global.js" defer></script>
    <script src="../scripts/global_keyboard.js" defer></script>
    <script src="../scripts/templates.js" defer></script>
    <script src="../scripts/board.js" defer></script>
    <script src="../scripts/add_task_core.js" defer></script>
    <script src="../scripts/add_task_keyboard.js" defer></script>
    <script src="../scripts/add_task_subtasks.js" defer></script>
    <script src="../scripts/add_task_validation.js" defer></script>
    <script src="../scripts/rendering.js" defer></script>
    <script src="../scripts/contacts_dialogs.js" defer></script>

</head>

<body onload="initAddTask(); eachPageSetCurrentUserInitials(); initNavKeyboardSupport()">
    <nav role="navigation" aria-label="Main navigation">
        <div class="sidenav">
            <div class="nav_icon">
                <img src="../assets/icons/Join_light.png" alt="Join Logo" aria-hidden="true">
            </div>
            <section class="menu">
                <div class="nav_navigation">
                    <a class="nav_summary" href="summary.html" aria-label="Go to Summary page">
                        <img src="../assets/icons/Prop_summary.svg" height="30" width="30" alt="" aria-hidden="true">
                        <p class="nav_p">Summary</p>
                    </a>
                    <a class="nav_add_task active" href="add_task.html" aria-current="page"
                        aria-label="Add Task page - currently selected">
                        <img src="../assets/icons/Prop_add_task.svg" height="30" width="30" alt="" aria-hidden="true">
                        <p class="nav_p">Add Task</p>
                    </a>
                    <a class="nav_board" href="board.html" aria-label="Go to Board page">
                        <img src="../assets/icons/Prop_board.svg" height="30" width="30" alt="" aria-hidden="true">
                        <p class="nav_p">Board</p>
                    </a>
                    <a class="nav_contacts" href="contacts.html" aria-label="Go to Contacts page">
                        <img src="../assets/icons/Prop_contacts.svg" height="30" width="30" alt="" aria-hidden="true">
                        <p class="nav_p">Contacts</p>
                    </a>
                </div>

                <div class="nav_policy">
                    <a class="privacy_policy" href="privacy_policy.html" aria-label="Read our privacy policy">Privacy
                        Policy</a>
                    <a class="legal_notes" href="legal_notice.html" aria-label="Read our legal notice">Legal notice</a>
                </div>
            </section>
        </div>
    </nav>

    <header role="banner">
        <div class="header_content">
            <div class="header-left">
                <h2 class="header_h2">Kanban Project Management Tool</h2>
                <img class="header-left-img" src="../assets/icons/Join_dark.png" alt="Join Logo" aria-hidden="true">
            </div>
            <div class="header-right">
                <a class="a_help_summary" href="help.html" aria-label="Get help and support">
                    <img class="help-icon" src="../assets/icons/help_icon.svg" alt="" aria-hidden="true">
                </a>
                <div class="user-circle" onclick="toggleDropDownMenu()" onkeydown="handleUserMenuKeydown(event)"
                    id="currentUserInitials" tabindex="0" role="button" aria-expanded="false" aria-haspopup="menu"
                    aria-label="User menu" aria-controls="user-menu">
                </div>

                <div class="user-menu" id="user-menu" role="menu" aria-hidden="true">
                    <a class="user-menu-help" href="help.html" role="menuitem">Help</a>
                    <a class="user-menu-legal-notice" href="legal_notice.html" role="menuitem">Legal Notice</a>
                    <a class="user-menu-privacy-policy" href="privacy_policy.html" role="menuitem">Privacy
                        Policy</a>
                    <a class="user-menu-logout" href="../index.html" id="logout-btn" onclick="logout()"
                        role="menuitem">Log
                        out</a>
                </div>
            </div>
        </div>
    </header>

    <main id="mainAddTask" class="main-add-task" role="main">


        <img id="success-toast-img" src="/assets/img/added_to_board.svg" alt="Success: Task added to board" role="alert"
            src="../assets/img/added_to_board.svg" alt="Success: Task added to board" role="alert" class="success-toast-img d-none">
    </main>

    <div id="rotateInfoOverlay">
        <div class="rotate-box">
            <img src="../assets/icons/rotate_phone.png" alt="rotate-phone" class="rotate-phone">
            <p>Please rotate your Phone</p>
        </div>
    </div>

</body>

</html>
